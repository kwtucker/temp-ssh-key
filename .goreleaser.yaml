version: 2

project_name: temp-ssh-key

before:
  hooks:
    - go mod tidy -diff
    - go test ./...

builds:
  - id: temp-ssh-key
    main: ./cmd/temp-ssh-key
    binary: temp-ssh-key
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  github:
    owner: kwtucker
    name: temp-ssh-key
  draft: false
  prerelease: auto
