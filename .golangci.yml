version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - grouper
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - predeclared
    - staticcheck
    - unconvert
    - unused
  settings:
    govet:
      disable:
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - unnamedResult
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests deliberately create world-readable public keys and 0755 fake
      # ssh-keygen scripts to exercise real permission behavior.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kwtucker/temp-ssh-key
